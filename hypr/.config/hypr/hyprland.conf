###############
### MONITORS ###
###############
monitor=,preferred,auto,auto
monitor=HDMI-A-1,1920x1080@60,0x0,1
monitor=eDP-1,preferred,auto,1

###################
### VARIABLES ###
###################
$mainMod = SUPER
$terminal = alacritty
$fileManager = dolphin
$menu = wofi --show drun
$browser = vivaldi

#################
### AUTOSTART ###
#################
exec-once = waybar
exec-once = nm-applet
exec-once = dunst
exec-once = polkit-kde-agent
exec-once = dbus-update-activation-environment --systemd DISPLAY WAYLAND_DISPLAY XDG_CURRENT_DESKTOP XDG_SESSION_TYPE XDG_SESSION_DESKTOP HYPRLAND_INSTANCE_SIGNATURE QT_QPA_PLATFORMTHEME KDE_FULL_SESSION KDE_SESSION_VERSION
exec-once = systemctl --user import-environment DISPLAY WAYLAND_DISPLAY XDG_CURRENT_DESKTOP XDG_SESSION_TYPE XDG_SESSION_DESKTOP HYPRLAND_INSTANCE_SIGNATURE QT_QPA_PLATFORMTHEME KDE_FULL_SESSION KDE_SESSION_VERSION
exec-once = awww-daemon
exec-once = $HOME/Pictures/dynamic-wallpaper-awww.sh
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
exec-once = /usr/lib/xdg-desktop-portal-hyprland
exec-once = sleep 2 && /usr/lib/xdg-desktop-portal --replace

#############################
### ENVIRONMENT ###
#############################
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = KDE_FULL_SESSION,true
env = KDE_SESSION_VERSION,6

#####################
### LOOK & FEEL ###
#####################
general {
    gaps_in = 4
    gaps_out = 8
    border_size = 2
    resize_on_border = true
    allow_tearing = false
    layout = dwindle

    col.active_border = rgba(88c0d0ff)
    col.inactive_border = rgba(2e3440aa)
}

decoration {
    rounding = 23

    active_opacity = 0.96
    inactive_opacity = 0.91
    fullscreen_opacity = 1.0

    blur {
        enabled = true
        size = 2
        passes = 2
        brightness = 1.53
        contrast = 0.96
        noise = 0.002
        new_optimizations = true
    }

    shadow {
        enabled = true
        range = 18
        render_power = 2
        color = rgba(713f1228)
    }
}

animations {
    enabled = true

    bezier = easeOutQuint, 0.23, 1, 0.32, 1
    bezier = easeInOutCubic, 0.65, 0.05, 0.36, 1
    bezier = linear, 0, 0, 1, 1

    animation = windows, 1, 4, easeOutQuint
    animation = windowsIn, 1, 4, easeOutQuint, popin 87%
    animation = windowsOut, 1, 4, easeInOutCubic, popin 87%
    animation = border, 1, 8, default
    animation = fade, 1, 4, default
    animation = workspaces, 1, 5, easeOutQuint
}

dwindle {
    #pseudotile = true
    preserve_split = true
}

master {
    new_status = master
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
}

#################
### INPUT ###
#################
input {
    kb_layout = latam
    follow_mouse = 1
    sensitivity = 0

    touchpad {
        natural_scroll = true
    }
}


############################
### WINDOW RULES ###
############################
#windowrule = opacity 0.90 0.82, class:^(Alacritty)$
#windowrule = opacity 0.92 0.85, class:^(wofi)$
#windowrule = opacity 0.94 0.88, class:^(dolphin)$
#windowrule = opacity 0.90 0.84, class:^(Brave-browser)$
#windowrule = opacity 0.93 0.86, class:^(dunst)$

###################
### KEYBINDS ###
###################

# lock
bind = $mainMod SHIFT, L, exec, hyprlock

# apps principales
bind = $mainMod, RETURN, exec, $terminal
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, space, exec, $menu
bind = $mainMod, B, exec, $browser
bind = $mainMod, R, exec, kate ~/.config/hypr/hyprland.conf

# cerrar / salir
bind = $mainMod, Q, killactive,
bind = $mainMod SHIFT, E, exit,

# floating / fullscreen
bind = $mainMod, T, togglefloating,
bind = $mainMod, F, fullscreen, 0
bind = $mainMod, P, pseudo,

# clipboard history
bind = $mainMod, V, exec, cliphist list | wofi --dmenu | cliphist decode | wl-copy

# btop
bind = $mainMod, escape, exec, alacritty -e btop

# screenshots
bind = $mainMod SHIFT, S, exec, grim -g "$(slurp)" - | wl-copy
bind = , PRINT, exec, grim - | wl-copy

# mover foco
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

bind = $mainMod, H, movefocus, l
bind = $mainMod, L, movefocus, r
bind = $mainMod, K, movefocus, u
bind = $mainMod, J, movefocus, d

# mover ventanas
bind = $mainMod SHIFT, left, movewindow, l
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, up, movewindow, u
bind = $mainMod SHIFT, down, movewindow, d

bind = $mainMod SHIFT, H, movewindow, l
bind = $mainMod SHIFT, L, movewindow, r
bind = $mainMod SHIFT, K, movewindow, u
bind = $mainMod SHIFT, J, movewindow, d

# resize
bind = $mainMod CTRL, left, resizeactive, -40 0
bind = $mainMod CTRL, right, resizeactive, 40 0
bind = $mainMod CTRL, up, resizeactive, 0 -40
bind = $mainMod CTRL, down, resizeactive, 0 40

# workspaces
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# cambiar workspace con rueda
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# mover / redimensionar con mouse
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

########################
### MEDIA / SYSTEM ###
########################
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle

bindel = ,XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 5%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-
